  <rect x="12" y="11" width="1" height="2" fill="#c0f0e8"/>
  <rect x="16" y="11" width="1" height="2" fill="#c0f0e8"/>
  <rect x="13" y="11" width="3" height="2" fill="#80c8b8"/>
  <rect x="12" y="13" width="5" height="1" fill="#c0f0e8"/>
