  <rect x="10" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="11" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="12" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="13" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="15" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="16" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="17" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="18" y="17" width="1" height="1" fill="#80c8b8"/>
  <rect x="19" y="17" width="1" height="1" fill="#80c8b8"/>
