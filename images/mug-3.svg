<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#1a1000"/>
  <!-- Flames above mug -->
  <rect x="10" y="1" width="1" height="1" fill="#ff4422"/>
  <rect x="11" y="2" width="1" height="2" fill="#ff6622"/>
  <rect x="10" y="3" width="1" height="1" fill="#ff8833"/>
  <rect x="12" y="1" width="1" height="1" fill="#ffaa00"/>
  <rect x="13" y="2" width="1" height="1" fill="#ff6622"/>
  <rect x="15" y="2" width="1" height="1" fill="#ff4422"/>
  <rect x="16" y="1" width="1" height="2" fill="#ff6622"/>
  <rect x="17" y="2" width="1" height="1" fill="#ffaa00"/>
  <rect x="18" y="1" width="1" height="1" fill="#ff4422"/>
  <rect x="19" y="2" width="1" height="2" fill="#ff8833"/>
  <rect x="14" y="3" width="1" height="1" fill="#ffcc44"/>
  <rect x="16" y="3" width="1" height="1" fill="#ffcc44"/>
  <!-- Smoke wisps -->
  <rect x="12" y="4" width="1" height="1" fill="rgba(255,200,100,0.3)"/>
