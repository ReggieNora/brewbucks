  <rect x="6" y="3" width="1" height="1" fill="#ff4422"/>
  <rect x="21" y="5" width="2" height="1" fill="#cc3300"/>
  <rect x="22" y="4" width="2" height="1" fill="#cc3300"/>
  <rect x="23" y="3" width="1" height="1" fill="#ff4422"/>
  <!-- Lid -->
  <rect x="8" y="6" width="14" height="2" fill="#8a6b00"/>
  <rect x="9" y="6" width="12" height="1" fill="#b8930a"/>
  <!-- Mug body — taller, narrower -->
  <rect x="9" y="8" width="12" height="15" fill="#b8930a"/>
  <rect x="10" y="8" width="10" height="15" fill="#d4a90e"/>
  <rect x="10" y="8" width="10" height="1" fill="#e8c644"/>
  <!-- Star pattern -->
  <rect x="14" y="10" width="2" height="1" fill="#fff5cc"/>
  <rect x="13" y="11" width="4" height="1" fill="#fff5cc"/>
  <rect x="12" y="12" width="6" height="1" fill="#fff5cc"/>
  <rect x="13" y="13" width="4" height="1" fill="#fff5cc"/>
  <rect x="12" y="14" width="2" height="1" fill="#fff5cc"/>
  <rect x="16" y="14" width="2" height="1" fill="#fff5cc"/>
  <rect x="11" y="15" width="2" height="1" fill="#fff5cc"/>
  <rect x="17" y="15" width="2" height="1" fill="#fff5cc"/>
  <!-- Flame accents on mug body -->
  <rect x="10" y="18" width="1" height="2" fill="#ff6622"/>
  <rect x="11" y="19" width="1" height="2" fill="#ff8833"/>
  <rect x="12" y="18" width="1" height="1" fill="#ffaa00"/>
  <rect x="17" y="18" width="1" height="1" fill="#ffaa00"/>
  <rect x="18" y="19" width="1" height="2" fill="#ff8833"/>
  <rect x="19" y="18" width="1" height="2" fill="#ff6622"/>
  <!-- RARE text -->
  <rect x="12" y="21" width="1" height="1" fill="#fff5cc"/>
  <rect x="14" y="21" width="1" height="1" fill="#fff5cc"/>
  <rect x="16" y="21" width="1" height="1" fill="#fff5cc"/>
  <rect x="18" y="21" width="1" height="1" fill="#fff5cc"/>
  <!-- Handle — chunky style -->
  <rect x="20" y="10" width="3" height="2" fill="#8a6b00"/>
  <rect x="22" y="12" width="2" height="4" fill="#8a6b00"/>
  <rect x="20" y="16" width="3" height="2" fill="#8a6b00"/>
  <rect x="21" y="11" width="1" height="1" fill="#b8930a"/>
  <rect x="21" y="16" width="1" height="1" fill="#b8930a"/>
  <!-- Base -->
  <rect x="8" y="23" width="14" height="2" fill="#8a6b00"/>
  <rect x="9" y="23" width="12" height="1" fill="#b8930a"/>
