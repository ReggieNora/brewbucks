<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#0d0b1a"/>
  <!-- Glow aura -->
  <rect x="7" y="6" width="1" height="16" fill="rgba(139,95,200,0.08)"/>
  <rect x="22" y="6" width="1" height="16" fill="rgba(139,95,200,0.06)"/>
  <!-- Steam - left lightning bolt -->
  <rect x="10" y="1" width="1" height="1" fill="#9b7acc" opacity="0.6"/>
  <rect x="11" y="2" width="1" height="1" fill="#8b6bc0"/>
  <rect x="10" y="3" width="1" height="1" fill="#9b7acc"/>
  <rect x="11" y="4" width="1" height="1" fill="#8b6bc0" opacity="0.7"/>
  <!-- Steam - right lightning bolt -->
  <rect x="20" y="1" width="1" height="1" fill="#9b7acc" opacity="0.5"/>
  <rect x="19" y="2" width="1" height="1" fill="#8b6bc0"/>
  <rect x="20" y="3" width="1" height="1" fill="#9b7acc"/>
  <rect x="19" y="4" width="1" height="1" fill="#8b6bc0" opacity="0.6"/>
  <!-- Lid -->
  <rect x="9" y="5" width="12" height="2" fill="#4a2d6e"/>
  <rect x="10" y="5" width="10" height="1" fill="#5a3d80"/>
  <!-- Mug body -->
  <rect x="8" y="7" width="13" height="15" fill="#4a2080"/>
  <rect x="9" y="7" width="11" height="15" fill="#7b4fb5"/>
  <rect x="9" y="7" width="11" height="1" fill="#a888d8"/>
  <rect x="10" y="8" width="2" height="13" fill="#9570cc"/>
  <!-- Coffee cup logo - steam swoosh -->
  <rect x="14" y="9" width="1" height="1" fill="#d0c0e8"/>
  <rect x="15" y="9" width="1" height="1" fill="#44bbff"/>
  <rect x="16" y="9" width="1" height="1" fill="#44bbff" opacity="0.5"/>
  <!-- Coffee cup logo - cup body -->
  <rect x="12" y="10" width="5" height="1" fill="#d0c0e8"/>
  <rect x="12" y="11" width="1" height="2" fill="#d0c0e8"/>
  <rect x="16" y="11" width="1" height="2" fill="#d0c0e8"/>
  <rect x="13" y="11" width="3" height="2" fill="#a890d4"/>
  <rect x="12" y="13" width="5" height="1" fill="#d0c0e8"/>
  <!-- Coffee cup logo - handle -->
  <rect x="17" y="11" width="1" height="2" fill="#d0c0e8"/>
  <!-- Coffee cup logo - saucer -->
  <rect x="11" y="14" width="8" height="1" fill="#b0a0d0"/>
  <!-- BREWBUCKS text -->
  <rect x="10" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="11" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="12" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="13" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="15" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="16" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="17" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="18" y="17" width="1" height="1" fill="#b898d0"/>
  <rect x="19" y="17" width="1" height="1" fill="#b898d0"/>
  <!-- Handle -->
  <rect x="21" y="9" width="2" height="2" fill="#5a2d8e"/>
  <rect x="22" y="11" width="2" height="5" fill="#5a2d8e"/>
  <rect x="21" y="16" width="2" height="2" fill="#5a2d8e"/>
  <rect x="21" y="10" width="1" height="1" fill="#7b4fb5"/>
  <rect x="21" y="16" width="1" height="1" fill="#7b4fb5"/>
